<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UNO Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Minimal, non-invasive defaults (scoped to this page only) */
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; }
    h1 { margin: 0 0 12px 0; font-size: 20px; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th, .lb-table td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    .lb-table th { font-weight: 600; }
    .muted { color:#666; font-size:12px; }
    .right { text-align:right; }
  </style>
</head>
<body>
  <h1>UNO Leaderboard</h1>
  <div class="toolbar">
    <button id="refreshBtn">Refresh</button>
    <label class="muted">Auto-refresh <input id="autoChk" type="checkbox" checked> (10s)</label>
  </div>

  <table class="lb-table" id="lbTable" aria-describedby="updatedAt">
    <thead>
      <tr>
        <th style="width:60px;">#</th>
        <th>Name</th>
        <th class="right" style="width:120px;">Wins</th>
        <th class="right" style="width:140px;">Points</th>
      </tr>
    </thead>
    <tbody id="lbBody">
      <tr><td colspan="4" class="muted">Loading…</td></tr>
    </tbody>
  </table>

  <div id="updatedAt" class="muted" style="margin-top:8px;"></div>

  <script>
  (function(){
    const $body = document.getElementById('lbBody');
    const $updated = document.getElementById('updatedAt');
    const $refresh = document.getElementById('refreshBtn');
    const $auto = document.getElementById('autoChk');
    let timer = null;

    async function load() {
      try {
        const res = await fetch('/leaderboard', { cache: 'no-store' });
        const data = await res.json();
        render(Array.isArray(data) ? data : []);
      } catch {
        render([]);
      }
    }

    function render(arr){
      // Server already sorts (wins desc, then points desc); keep that ordering.
      if (!arr.length) {
        $body.innerHTML = '<tr><td colspan="4" class="muted">No games recorded yet.</td></tr>';
      } else {
        $body.innerHTML = arr.map((row, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${escapeHtml(row.name || 'Player')}</td>
            <td class="right">${Number(row.wins||0)}</td>
            <td class="right">${Number(row.points||0)}</td>
          </tr>
        `).join('');
      }
      $updated.textContent = 'Updated: ' + new Date().toLocaleString();
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    $refresh.addEventListener('click', load);
    $auto.addEventListener('change', () => {
      if ($auto.checked) {
        if (timer) clearInterval(timer);
        timer = setInterval(load, 10000);
      } else if (timer) {
        clearInterval(timer); timer = null;
      }
    });

    // initial
    load();
    timer = setInterval(load, 10000);
  })();
  </script>
</body>
</html>
