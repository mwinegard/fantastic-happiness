<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNO Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="panel">
    <h1>Global Leaderboard</h1>
    <div id="leaderboard"></div>
  </div>
  <script>
    async function loadBoard(){
      try{
        const res = await fetch("/leaderboard", { cache: "no-store" });
        const data = await res.json();
        document.getElementById("leaderboard").innerHTML = renderBoard(data || []);
      }catch{
        document.getElementById("leaderboard").textContent = "Failed to load leaderboard.";
      }
    }
    function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
    function renderBoard(rows){
      const tr = r => `<tr><td>${esc(r.name)}</td><td>${Number(r.wins||0)}</td><td>${Number(r.points||0)}</td></tr>`;
      return `<table><thead><tr><th>Name</th><th>Wins</th><th>Points</th></tr></thead><tbody>${(rows||[]).map(tr).join("")}</tbody></table>`;
    }
    loadBoard();
  </script>
</body>
</html>
