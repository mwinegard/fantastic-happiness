<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="panel" id="join-screen">
    <h1>Join a Lobby</h1>
    <div class="row">
      <input id="name" placeholder="Your name" />
      <input id="lobby" placeholder="Lobby (e.g., default)" />
      <button id="joinbtn">Join</button>
    </div>
    <p class="muted">Your last name and lobby are remembered for quick join.</p>
  </div>

  <div class="panel" id="game-screen" style="display:none;">
    <h1>UNO</h1>

    <!-- Top area: discard & draw -->
    <div class="row" style="gap:16px;">
      <div>
        <div>Discard</div>
        <img id="discard-top" src="assets/cards/back.png" alt="Top Discard" class="card-img" />
      </div>
      <div>
        <div>Draw</div>
        <img id="draw-pile" src="assets/cards/back.png" alt="Draw Pile" class="card-img" />
      </div>
      <div>
        <div>Color</div>
        <div id="color-badge" style="font-weight:bold;">—</div>
      </div>
      <div style="margin-left:auto;">
        <button id="mute-toggle">🔊 Sound On</button>
      </div>
    </div>

    <!-- Turn indicator -->
    <div class="row" style="margin-top:8px;">
      <div id="turn-indicator">—</div>
      <div>
        <button id="uno-btn">Call UNO</button>
        <button id="relax-btn">RELAX</button>
      </div>
    </div>

    <!-- Players -->
    <h3>Players</h3>
    <div id="player-list"></div>

    <!-- Hand -->
    <h3>Your Hand</h3>
    <div id="player-hand"></div>

    <!-- Chat -->
    <h3>Table Chat</h3>
    <div id="chat-log"></div>
    <div class="row" style="margin-top:6px;">
      <input id="chat-input" placeholder="Type a message…" />
      <button id="chat-send">Send</button>
    </div>

    <!-- Leaderboard -->
    <h3>Global Leaderboard</h3>
    <div id="leaderboard"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
