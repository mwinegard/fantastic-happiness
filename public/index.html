<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fantastic Happiness — UNO</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="image" href="assets/cards/back.png" />
  <link rel="preload" as="image" href="assets/cards/red_0.png" />
  <link rel="preload" as="image" href="assets/cards/wild.png" />
</head>
<body>
  <!-- Join screen (acts as joinOverlay for game.js) -->
  <div id="joinOverlay" class="panel">
    <h1>Join the Table</h1>
    <form id="joinForm" class="row" style="gap:8px;">
      <input id="nameInput" placeholder="Your name (optional)" maxlength="24" />
      <button id="joinBtn" type="submit">Join</button>
    </form>
    <div class="note">A name is optional — we’ll generate one if you leave it blank.</div>
    <div id="status" class="note"></div>
  </div>

  <!-- Game screen -->
  <div id="game-screen" style="display:none;">
    <div class="topbar">
      <div id="dir-label">Direction: →</div>
      <div class="timer-display" id="timer">—</div>
      <div id="color-label">Color: —</div>
    </div>

    <!-- Prompts container (non-overlay; below timer) -->
    <div id="prompts"></div>

    <div class="board">
      <!-- Left: players -->
      <aside class="sidebar">
        <h3>Players</h3>
        <ul id="players"></ul>
        <div class="info">
          <button id="btnUno" disabled>UNO!</button>
        </div>
      </aside>

      <!-- Center: table -->
      <main class="table">
        <div class="piles">
          <div class="pile discard">
            <div class="stack s1"></div><div class="stack s2"></div><div class="stack s3"></div>
            <!-- game.js will inject an <img> here -->
            <div id="discardPile" class="card back"></div>
          </div>
          <div class="pile draw">
            <div class="stack s1"></div><div class="stack s2"></div><div class="stack s3"></div>
            <!-- game.js will inject an <img> here and handle clicks -->
            <div id="drawPile" class="card back"></div>
          </div>
        </div>

        <div id="hand" class="hand"></div>

        <!-- (Fallback) wild color picker; main picker shown via prompt dock -->
        <div id="wild-buttons" class="wild-picker" style="display:none;">
          <button data-color="red">RED</button>
          <button data-color="yellow">YELLOW</button>
          <button data-color="green">GREEN</button>
          <button data-color="blue">BLUE</button>
        </div>
      </main>

      <!-- Right: chat -->
      <section class="chat">
        <h3>Table Talk</h3>
        <div id="chatLog" class="chatlog"></div>
        <div class="chatform">
          <input id="chatInput" placeholder="Say something nice…" maxlength="200" />
          <button id="sendChat">Send</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Socket.IO + client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
  <script>
    // Show game screen after the client identifies ("me" event sets local me.id).
    // If your existing game.js already handles toggling visibility, you can remove this.
    (function(){
      const s = io();
      let shown = false;
      s.on('me', ()=> {
        if (shown) return;
        shown = true;
        const join = document.getElementById('joinOverlay');
        const game = document.getElementById('game-screen');
        if (join) join.style.display = 'none';
        if (game) game.style.display = '';
      });
      // Also reveal once we see state (fallback)
      s.on('state', ()=> {
        if (shown) return;
        shown = true;
        const join = document.getElementById('joinOverlay');
        const game = document.getElementById('game-screen');
        if (join) join.style.display = 'none';
        if (game) game.style.display = '';
      });
    })();
  </script>
</body>
</html>
