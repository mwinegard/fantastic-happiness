<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fantastic Happiness — UNO</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="image" href="assets/cards/back.png" />
  <link rel="preload" as="image" href="assets/cards/red_0.png" />
  <link rel="preload" as="image" href="assets/cards/wild.png" />
</head>
<body>
  <!-- Join screen -->
  <div id="join-screen" class="panel">
    <h1>Join the Table</h1>
    <div class="row">
      <input id="name" placeholder="Your name" maxlength="24" />
      <input id="lobby" placeholder="Lobby (e.g. default)" maxlength="24" />
      <button id="joinbtn">Join</button>
    </div>
    <div class="note">Name & lobby will be remembered for next time.</div>
  </div>

  <!-- Game screen -->
  <div id="game-screen" class="panel" style="display:none;">
    <div class="topbar">
      <div id="turn-indicator">—</div>
      <div class="right">
        <span>Color: <b id="color-badge">—</b></span>
        <button id="uno-btn" disabled>UNO!</button>
        <button id="relax-btn" disabled>RELAX</button>
        <button id="mute-toggle">🔊 Sound On</button>
      </div>
    </div>

    <div class="board">
      <div class="piles">
        <img id="draw-pile" class="pile" src="assets/cards/back.png" alt="Draw pile" />
        <img id="discard-top" class="pile" src="assets/cards/back.png" alt="Discard pile" />
      </div>

      <div id="player-hand" class="hand"></div>

      <div class="sidebar">
        <div class="players">
          <h3>Players</h3>
          <div id="player-list"></div>
        </div>
        <div class="chat">
          <h3>Chat</h3>
          <div id="chat-log" class="chatlog"></div>
          <div class="row">
            <input id="chat-input" placeholder="Type message…" maxlength="200" />
            <button id="chat-send">Send</button>
          </div>
        </div>
      </div>
    </div>

    <hr />
    <div id="leaderboard-block">
      <h3>Global Leaderboard</h3>
      <div id="leaderboard"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
