<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UNO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join Screen -->
  <div id="join-screen">
    <h1>UNO</h1>
    <input id="name" type="text" placeholder="Enter your name">
    <button id="join-btn">Join Game</button>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" style="display:none;">
    <header>
      <div id="turn-indicator">—</div>
      <div id="dir-label"></div>
      <div id="color-label"></div>
    </header>

    <!-- Prompt Dock lives right below timer (populated by game.js) -->
    <div id="prompt-dock"></div>

    <!-- Board -->
    <div class="board">
      <div id="draw-pile" class="pile"></div>
      <div id="discard-top" class="pile"></div>
    </div>

    <!-- Hand -->
    <div id="player-hand" class="hand"></div>
    <button id="uno-btn" disabled>UNO!</button>

    <!-- Player list -->
    <ul id="player-list"></ul>

    <!-- Chat -->
    <div id="chat">
      <div id="chat-log"></div>
      <input id="chat-input" type="text" placeholder="Say something">
      <button id="chat-send">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
