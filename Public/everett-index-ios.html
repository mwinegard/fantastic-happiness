<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Everett Index™</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: linear-gradient(180deg, #0f172a, #020617);
    --glass: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.15);
}

* {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    background: var(--bg);
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 390px;
    padding: 16px;
}

.header {
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0;
}

.header p {
    font-size: 0.9rem;
    color: #94a3b8;
    margin: 4px 0 0;
}

.card {
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
}

.index {
    font-size: 4.5rem;
    font-weight: 800;
    text-align: center;
    margin: 10px 0;
}

.status {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 18px;
}

.slider-wrap {
    margin-top: 18px;
}

input[type=range] {
    width: 100%;
    height: 44px;
    appearance: none;
    background: transparent;
}

input[type=range]::-webkit-slider-runnable-track {
    height: 10px;
    background: #1e293b;
    border-radius: 10px;
}

input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #f8fafc;
    margin-top: -13px;
    box-shadow: 0 6px 14px rgba(0,0,0,.5);
}

.scale {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #cbd5f5;
    margin-top: 8px;
}

.footer {
    text-align: center;
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 16px;
}
</style>
</head>

<body>

<div class="app">
    <div class="header">
        <h1>Everett Index™</h1>
        <p>Live Mood Advisory</p>
    </div>

    <div class="card">
        <div class="index" id="value">5</div>

        <div class="status" id="status">👀 Monitor Closely</div>

        <div class="slider-wrap">
            <input type="range" min="0" max="10" step="1" value="5" id="slider">
            <div class="scale">
                <span>Goblin</span>
                <span>Idyllic</span>
            </div>
        </div>
    </div>

    <div class="footer">
        Conditions update instantly<br>
        Not recognized by medical professionals
    </div>
</div>

<script>
const slider = document.getElementById("slider");
const value = document.getElementById("value");
const status = document.getElementById("status");

function update(val) {
    value.textContent = val;

    if (val <= 2) {
        status.textContent = "🚫 No Visits Allowed";
        status.style.background = "#7f1d1d";
    } else if (val <= 4) {
        status.textContent = "⚠️ High Risk Behavior";
        status.style.background = "#b45309";
    } else if (val <= 6) {
        status.textContent = "👀 Monitor Closely";
        status.style.background = "#a16207";
    } else if (val <= 8) {
        status.textContent = "✅ Visit Approved";
        status.style.background = "#15803d";
    } else {
        status.textContent = "🌈 Idyllic Conditions";
        status.style.background = "#0ea5e9";
    }
}

slider.addEventListener("input", e => update(e.target.value));
update(slider.value);
</script>

</body>
</html>
